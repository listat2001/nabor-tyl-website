<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подать заявку</title><link rel="stylesheet" href="../style.css"><link rel="icon" href="../assets/favicon.svg"><script defer src="../assets/motion.js"></script></head><body><header class="site-header"><div class="wrap head"><a class="logo" href="../index.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg><span>Служба по контракту</span></a><nav class="nav"><a href="../index.html">Главная</a><a href="../vacancies/index.html">Вакансии</a><a href="../apply/index.html">Подать заявку</a><a href="../contacts/index.html">Контакты</a></nav><a class="btn nav-cta" href="../apply/index.html">Оставить заявку</a></div></header><section class="section"><div class="wrap"><h1 style="text-align:center">Подать заявку</h1><div class="card form"><form onsubmit="if(location.protocol==='file:'){alert('Это локальный предпросмотр. Отправка заявок будет работать только после настройки PHP и почты на хостинге.');return false;}" method="post" action="../send.php"><label for="name">ФИО *</label><input name="name" id="name" required maxlength="150" autocomplete="name"><label for="phone">Телефон *</label><input name="phone" id="phone" required maxlength="30" autocomplete="tel"><label for="age">Возраст *</label><input name="age" id="age" type="number" min="18" max="60" required><label for="region">Регион проживания *</label><input name="region" id="region" maxlength="150" required><label for="vacancy">Вакансия *</label><select id="vacancy" name="vacancy" required><option value="">Выберите вакансию</option><option value="voditel">Водитель</option><option value="povar">Повар</option><option value="svyazist">Связист</option><option value="logist">Логист / Кладовщик</option><option value="medik">Медик / Санитар</option><option value="mehanik">Механик / Техник</option></select><div class="check"><input id="consent" type="checkbox" name="consent" value="yes" required><label for="consent">Согласен(а) на обработку персональных данных. <a href="../privacy/index.html">Политика обработки персональных данных</a></label></div><div style="position:absolute;left:-9999px" aria-hidden="true"><label>Не заполнять <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div><button class="btn" type="submit">Отправить заявку</button><p class="muted">Данные отправляются по защищённому соединению при настроенном HTTPS.</p></form></div></div></section><script>const v=new URLSearchParams(location.search).get('vacancy');if(v){const s=document.querySelector('#vacancy');if([...s.options].some(x=>x.value===v))s.value=v}</script><footer><div class="wrap foot"><a class="logo" href="../index.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg><span>Служба по контракту</span></a><nav class="foot-links"><a href="../vacancies/index.html">Вакансии</a><a href="../apply/index.html">Заявка</a><a href="../contacts/index.html">Контакты</a></nav><span>Информационный ресурс. Не является официальным сайтом МО РФ.</span></div></footer></body></html>
